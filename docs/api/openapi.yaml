  /api/receipts/upload-init:
    post:
      operationId: initializeUpload
      tags:
        - Receipts
      summary: Create pending receipt and signed Cloudinary upload parameters
      description: Create pending receipt and signed Cloudinary upload parameters
        Local development API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptUploadInitResponse'
              example:
                receiptId: 1
                status: PENDING_UPLOAD
                uploadUrl: https://api.cloudinary.com/v1_1/example/image/upload
                cloudName: example
                apiKey: EXAMPLE_KEY
                timestamp: 1795620000
                publicId: receipts/1/example-uuid
                signature: EXAMPLE_SIGNATURE
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/receipts/upload-init
        '500':
          description: User not found or upload signing/persistence failure Default
            Spring error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/receipts/upload-init
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          example: 1
  /api/receipts/{receiptId}/upload-complete:
    post:
      operationId: completeUpload
      tags:
        - Receipts
      summary: Validate public ID and Cloudinary URL prefix and mark receipt UPLOADED
      description: Validate public ID and Cloudinary URL prefix and mark receipt UPLOADED
        Local development API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/receipts/1/upload-complete
        '500':
          description: Receipt not found; receipt is not waiting for upload; invalid
            Cloudinary public id; missing or invalid Cloudinary URL Default Spring
            error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/receipts/1/upload-complete
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptUploadCompleteRequest'
            example:
              publicId: receipts/1/example-uuid
              secureUrl: https://res.cloudinary.com/example/image/upload/example.jpg
components:
  schemas:
    TransactionRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Positive monetary amount; database precision 19, scale 2.
        currencyCode:
          type: string
          description: Existing currency code; case-sensitive lookup.
        transactionDate:
          type: string
          format: date
        description:
          type: string
          nullable: true
          description: Optional description; database limit 500 characters.
      required:
        - amount
        - currencyCode
        - transactionDate
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Positive monetary amount; database precision 19, scale 2.
        currencyCode:
          type: string
          description: Existing currency code; case-sensitive lookup.
        transactionDate:
          type: string
          format: date
        description:
          type: string
          nullable: true
          description: Optional description; database limit 500 characters.
      required:
        - id
        - userId
        - amount
        - currencyCode
        - transactionDate
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        currencyCode:
          type: string
      required:
        - id
        - email
        - currencyCode
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
          description: Null or blank leaves unchanged; duplicate email fails.
        currencyCode:
          type: string
          nullable: true
          description: Null or blank leaves unchanged.
    ReceiptUploadCompleteRequest:
      type: object
      properties:
        publicId:
          type: string
        secureUrl:
          type: string
      required:
        - publicId
        - secureUrl
    ReceiptUploadInitResponse:
      type: object
      properties:
        receiptId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - PENDING_UPLOAD
        uploadUrl:
          type: string
        cloudName:
          type: string
        apiKey:
          type: string
        timestamp:
          type: integer
          format: int64
        publicId:
          type: string
        signature:
          type: string
      required:
        - receiptId
        - status
        - uploadUrl
        - cloudName
        - apiKey
        - timestamp
        - publicId
        - signature
    Error:
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
        error:
          type: string
        path:
          type: string
        message:
          type: string
