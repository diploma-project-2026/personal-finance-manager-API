              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions/recent
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions/recent
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
  /api/users/{userId}/transactions/date/{date}:
    get:
      operationId: getByDate
      tags:
        - Transactions
      summary: List transactions for an ISO calendar date
      description: List transactions for an ISO calendar date Local development API;
        caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
              example:
                - id: 1
                  userId: 1
                  amount: 15.25
                  currencyCode: EUR
                  transactionDate: '2026-11-25'
                  description: Groceries
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions/date/2026-11-25
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions/date/2026-11-25
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-25'
  /api/users/{userId}/transactions/filter:
    get:
      operationId: getByDateRange
      tags:
        - Transactions
      summary: List transactions in inclusive date range, ordered by date descending
      description: List transactions in inclusive date range, ordered by date descending
        Local development API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
              example:
                - id: 1
                  userId: 1
                  amount: 15.25
                  currencyCode: EUR
                  transactionDate: '2026-11-25'
                  description: Groceries
        '400':
          description: Invalid date range or missing/malformed date parameter Default
            Spring error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions/filter
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions/filter
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-25'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-25'
  /api/users/{userId}/transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags:
        - Transactions
      summary: Get transaction belonging to supplied user ID
      description: Get transaction belonging to supplied user ID Local development
        API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              example:
                id: 1
                userId: 1
                amount: 15.25
                currencyCode: EUR
                transactionDate: '2026-11-25'
                description: Groceries
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions/1
        '404':
          description: Transaction not found (including mismatched user ID) Default
            Spring error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 404
                error: Not Found
                path: /api/users/1/transactions/1
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions/1
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
    put:
      operationId: updateTransaction
      tags:
        - Transactions
      summary: Replace transaction amount, currency, date and description
      description: Replace transaction amount, currency, date and description Local
        development API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              example:
                id: 1
                userId: 1
                amount: 20
                currencyCode: EUR
                transactionDate: '2026-11-25'
                description: Groceries
        '400':
          description: Amount must be positive; transaction date is required; currency
            code is required; or malformed request Default Spring error response;
            message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions/1
        '404':
          description: Transaction not found or currency not found Default Spring
            error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 404
                error: Not Found
                path: /api/users/1/transactions/1
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions/1
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              amount: 20
              currencyCode: EUR
              transactionDate: '2026-11-25'
              description: Groceries
    delete:
      operationId: deleteTransaction
      tags:
        - Transactions
      summary: Delete transaction belonging to supplied user ID
      description: Delete transaction belonging to supplied user ID Local development
        API; caller identity is not authenticated.
      responses:
        '204':
          description: No content
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions/1
        '404':
          description: Transaction not found (including mismatched user ID) Default
            Spring error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
