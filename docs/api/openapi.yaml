openapi: 3.0.3
info:
  title: Personal Finance Manager Backend API
  version: 0.0.1
  description: As-built local development contract for the Spring Boot controllers.
    No HTTP authentication is implemented. Do not expose publicly. Examples are illustrative,
    not captured live responses.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot
security: []
tags:
  - name: Users
    description: User profile and preferred currency management.
  - name: Transactions
    description: Transaction management, history and date filtering.
  - name: Receipts
    description: Receipt upload initialization and confirmation.
paths:
  /api/users/{id}:
    get:
      operationId: getUser
      tags:
        - Users
      summary: Get user by ID
      description: Get user by ID Local development API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 1
                email: review@example.test
                currencyCode: EUR
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1
        '500':
          description: User not found (unmapped UserNotFoundException) Default Spring
            error response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
    put:
      operationId: updateUser
      tags:
        - Users
      summary: Update nonblank email and preferred currency
      description: Update nonblank email and preferred currency Local development
        API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 1
                email: updated@example.test
                currencyCode: EUR
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1
        '500':
          description: User not found; currency not found; or user already exists
            with this email Default Spring error response; message visibility depends
            on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: updated@example.test
              currencyCode: EUR
    delete:
      operationId: deleteUser
      tags:
        - Users
      summary: Delete user; foreign key constraints may prevent deletion
      description: Delete user; foreign key constraints may prevent deletion Local
        development API; caller identity is not authenticated.
      responses:
        '204':
          description: No content
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
  /api/users/{userId}/transactions:
    post:
      operationId: createTransaction
      tags:
        - Transactions
      summary: Create a positive-amount transaction
      description: Create a positive-amount transaction Local development API; caller
        identity is not authenticated.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              example:
                id: 1
                userId: 1
                amount: 15.25
                currencyCode: EUR
                transactionDate: '2026-11-25'
                description: Groceries
        '400':
          description: Amount must be positive; transaction date is required; currency
            code is required; or malformed request Default Spring error response;
            message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions
        '404':
          description: User not found or currency not found Default Spring error response;
            message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 404
                error: Not Found
                path: /api/users/1/transactions
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              amount: 15.25
              currencyCode: EUR
              transactionDate: '2026-11-25'
              description: Groceries
    get:
      operationId: getHistory
      tags:
        - Transactions
      summary: List transactions ordered by transaction date descending; unknown user
        returns empty array
      description: List transactions ordered by transaction date descending; unknown
        user returns empty array Local development API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
              example:
                - id: 1
                  userId: 1
                  amount: 15.25
                  currencyCode: EUR
                  transactionDate: '2026-11-25'
                  description: Groceries
        '400':
          description: Malformed request or invalid parameter Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 400
                error: Bad Request
                path: /api/users/1/transactions
        '500':
          description: Unhandled service or persistence exception Default Spring error
            response; message visibility depends on configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-25T20:00:00Z'
                status: 500
                error: Internal Server Error
                path: /api/users/1/transactions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
  /api/users/{userId}/transactions/recent:
    get:
      operationId: getRecent
      tags:
        - Transactions
      summary: Return up to five transactions by date descending
      description: Return up to five transactions by date descending Local development
        API; caller identity is not authenticated.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
              example:
                - id: 1
                  userId: 1
                  amount: 15.25
                  currencyCode: EUR
                  transactionDate: '2026-11-25'
                  description: Groceries
        '400':
          description: Malformed request or invalid parameter Default Spring error
