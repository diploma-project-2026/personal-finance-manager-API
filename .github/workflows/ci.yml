name: 🚀 CI Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: ✨ Spotless Format Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 🔧 Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: 🎨 Check code formatting
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check


  spotbugs:
    name: 🐞 SpotBugs Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 🔍 Compile project and run SpotBugs
        run: ./mvnw --batch-mode --no-transfer-progress clean compile spotbugs:checkпе